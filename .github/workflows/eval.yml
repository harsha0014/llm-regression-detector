name: LLM Regression Detection

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'golden_dataset/**'
  workflow_dispatch:

# CRITICAL: Add permissions to post PR comments
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t regression-detector .

      - name: Run evaluation
        id: eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          docker run \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            -v ${PWD}:/app \
            regression-detector > eval_output.txt 2>&1
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Upload eval log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-log
          path: eval_output.txt

      - name: Print eval log
        if: always()
        run: |
          echo "=== Eval Output ==="
          cat eval_output.txt
          echo "=== End Eval Output ==="

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: report.html

      - name: Post PR comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('eval_output.txt', 'utf8');
            
            // Debug: print the content to the log
            console.log('=== eval_output.txt content ===');
            console.log(output);
            console.log('=== end ===');
            
            // --- Bulletproof extraction using split & includes ---
            const lines = output.split('\n');
            let passRate = 'N/A';
            let deepEval = 'N/A';
            let delta = 'N/A';
            let regressions = '0';
            
            for (const line of lines) {
              if (line.includes('Pass rate:')) {
                const match = line.match(/([\d.]+%)/);
                if (match) passRate = match[1];
              }
              if (line.includes('Avg DeepEval Summary Score:')) {
                const match = line.match(/([\d.]+)/);
                if (match) deepEval = match[1];
              }
              if (line.includes('Pass rate delta:')) {
                const match = line.match(/([+-][\d.]+%)/);
                if (match) delta = match[1];
              }
              if (line.includes('Regressions:')) {
                const match = line.match(/(\d+)/);
                if (match) regressions = match[1];
              }
            }
            
            const critical = output.includes('CRITICAL regression detected') ? '❌ CRITICAL' : '✅ No critical regression';
            
            let comment = `## 🤖 LLM Regression Report\n\n`;
            comment += `| Metric | Value |\n|--------|-------|\n`;
            comment += `| Pass Rate | ${passRate} |\n`;
            comment += `| DeepEval Score | ${deepEval} |\n`;
            comment += `| Delta vs Baseline | ${delta} |\n`;
            comment += `| Regressions | ${regressions} |\n`;
            comment += `| Status | ${critical} |\n\n`;
            
            if (critical.includes('CRITICAL')) {
              comment += `⚠️ **This PR introduces a critical regression. Please review before merging.**\n`;
            } else {
              comment += `✅ **No significant regression detected.** Safe to merge.`;
            }
            
            comment += `\n📄 [Download full report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('LLM Regression Report'));
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Fail PR if critical regression detected
        if: steps.eval.outputs.status == '1'
        run: |
          echo "❌ Critical regression detected – blocking merge."
          exit 1